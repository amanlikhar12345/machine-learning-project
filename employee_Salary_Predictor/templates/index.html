<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Salary Predictor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <script defer
            src="{{ url_for('static', filename='script.js') }}">
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="background"></div>

<div class="container">

    <div class="card">

        <div class="header">

            <div class="logo">

                <i class="fa-solid fa-chart-line"></i>

            </div>

            <div>

                <h1>Employee Salary Predictor</h1>

                <p>
                    Predict employee salary using Machine Learning
                </p>

            </div>

        </div>

        <form action="/predict" method="POST" id="salaryForm">

            <div class="grid">

                <!-- Experience -->

                <div class="input-box">

                    <label>

                        <i class="fa-solid fa-briefcase"></i>

                        Experience (Years)

                    </label>

                    <input
                        type="number"
                        name="experience"
                        placeholder="Enter experience"
                        min="0"
                        step="0.1"
                        required>

                </div>

                <!-- Skills -->

                <div class="input-box">

                    <label>

                        <i class="fa-solid fa-code"></i>

                        Skills Count

                    </label>

                    <input
                        type="number"
                        name="skills"
                        placeholder="Total Skills"
                        min="1"
                        required>

                </div>

                <!-- Certifications -->

                <div class="input-box">

                    <label>

                        <i class="fa-solid fa-certificate"></i>

                        Certifications

                    </label>

                    <input
                        type="number"
                        name="certifications"
                        placeholder="Certificates"
                        min="0"
                        required>

                </div>

                <!-- Job Title -->

                <div class="input-box">

                    <label>

                        <i class="fa-solid fa-user-tie"></i>

                        Job Title

                    </label>

                    <select name="job_title" required>

                        <option value="">Select</option>

                        <option>Software Engineer</option>

                        <option>Data Scientist</option>

                        <option>Business Analyst</option>

                        <option>Data Analyst</option>

                        <option>Project Manager</option>

                        <option>HR Manager</option>

                        <option>Marketing Manager</option>

                        <option>Product Manager</option>

                    </select>

                </div>

                <!-- Education -->

                <div class="input-box">

                    <label>

                        <i class="fa-solid fa-graduation-cap"></i>

                        Education

                    </label>

                    <select name="education" required>

                        <option value="">Select</option>

                        <option>High School</option>

                        <option>Bachelor</option>

                        <option>Master</option>

                        <option>PhD</option>

                    </select>

                </div>

                <!-- Industry -->

                <div class="input-box">

                    <label>

                        <i class="fa-solid fa-building"></i>

                        Industry

                    </label>

                    <select name="industry" required>

                        <option value="">Select</option>

                        <option>IT</option>

                        <option>Finance</option>

                        <option>Healthcare</option>

                        <option>Education</option>

                        <option>Retail</option>

                        <option>Manufacturing</option>

                    </select>

                </div>
                <!-- Company Size -->

                <div class="input-box">

                    <label>
                        <i class="fa-solid fa-users"></i>
                        Company Size
                    </label>

                    <select name="company_size" required>

                        <option value="">Select</option>

                        <option>Small</option>

                        <option>Medium</option>

                        <option>Large</option>

                    </select>

                </div>


                <!-- Location -->

                <div class="input-box">

                    <label>
                        <i class="fa-solid fa-location-dot"></i>
                        Location
                    </label>

                    <select name="location" required>

                        <option value="">Select</option>

                        <option>Delhi</option>

                        <option>Mumbai</option>

                        <option>Bangalore</option>

                        <option>Hyderabad</option>

                        <option>Pune</option>

                        <option>Chennai</option>

                    </select>

                </div>


                <!-- Remote Work -->

                <div class="input-box">

                    <label>
                        <i class="fa-solid fa-laptop-house"></i>
                        Remote Work
                    </label>

                    <select name="remote_work" required>

                        <option value="">Select</option>

                        <option>Yes</option>

                        <option>No</option>

                    </select>

                </div>

            </div>


            <!-- Buttons -->

            <div class="button-group">

                <button type="submit" class="predict-btn">

                    <i class="fa-solid fa-wand-magic-sparkles"></i>

                    Predict Salary

                </button>

                <button type="reset" class="reset-btn">

                    <i class="fa-solid fa-rotate"></i>

                    Reset

                </button>

            </div>

        </form>


        <!-- Prediction Result -->

        {% if prediction_text %}

        <div class="result-card">

            <h2>

                <i class="fa-solid fa-money-bill-wave"></i>

                Predicted Salary

            </h2>

            <h1 id="salaryResult">

                {{ prediction_text }}

            </h1>

            <p>

                Prediction generated using Polynomial Regression Model

            </p>

        </div>

        {% endif %}

    </div>

</div>

</body>

</html>
