<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temperature Forecast — Polynomial Regression</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>🌡️ Temperature Forecaster</h1>
      <p>Polynomial Regression model — predicts December temperature from correlated months</p>
    </header>

    <main class="card">
      <form id="predict-form">
        <div class="grid" id="inputs-grid">
          {% for feat in features %}
          <div class="field">
            <label for="{{ feat }}">{{ feat }} (°C)</label>
            <input
              type="number"
              step="0.01"
              id="{{ feat }}"
              name="{{ feat }}"
              placeholder="e.g. 18.5"
              required
            />
          </div>
          {% endfor %}
        </div>

        <button type="submit" id="predict-btn">
          <span id="btn-text">Predict Temperature</span>
          <span id="btn-spinner" class="spinner hidden"></span>
        </button>
      </form>

      <div id="result" class="result hidden">
        <div class="result-label">Predicted December Temperature</div>
        <div class="result-value" id="result-value">--</div>
      </div>

      <div id="error" class="error hidden"></div>
    </main>

    <footer class="app-footer">
      <p>Model: Polynomial Regression (degree 2) &middot; Features: {{ features | join(', ') }}</p>
    </footer>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
